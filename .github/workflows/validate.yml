name: Validate skill

on:
  push:
    branches: [main, experiment/evolvable-router-tree]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The spec requires the skill name to match its directory name.
          path: practical-coding
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install skills-ref
        run: pip install "git+https://github.com/agentskills/agentskills.git#subdirectory=skills-ref"
      - name: Validate SKILL.md
        run: skills-ref validate ./practical-coding
      - name: Run benchmark harness unit tests
        working-directory: practical-coding
        run: python -m unittest benchmarks.test_benchmarks benchmarks.test_stability benchmarks.test_catalog benchmarks.test_ladder_analysis benchmarks.test_progressive_validation benchmarks.test_tree_benchmarks benchmarks.test_evolution_workflow
      - name: Run execution-state unit tests
        working-directory: practical-coding
        run: python -m unittest tests.test_skill_state_hardening tests.test_skill_state_host tests.test_skill_state_hypothesis_invariant tests.test_skill_state_model_gate_hardening tests.test_skill_state_model_gate_roles benchmarks.test_skill_state_runtime
      - name: Validate execution-state model-gate infrastructure
        working-directory: practical-coding
        run: |
          python benchmarks/skill_state_model_cases.py --self-test
          python benchmarks/skill_state_model_runner.py --self-test
          python benchmarks/skill_state_model_analysis.py --self-test
      - name: Validate tree topology contract
        working-directory: practical-coding
        run: python benchmarks/tree_validation.py --self-test
      - name: Validate explicit evolution workflow contract
        working-directory: practical-coding
        run: python benchmarks/evolution_workflow_validation.py --self-test --output benchmark-results/evolution-workflow-contract.json
      - name: Validate execution-state runtime contract
        working-directory: practical-coding
        run: python benchmarks/skill_state_validation.py --self-test --output benchmark-results/skill-state-contract.json
      - name: Check manual-only Decision layout
        run: |
          test ! -e practical-coding/references/decision.md
          test -e practical-coding/references/manual/decision.md
      - name: Check Codex default_prompt references the skill as $skill-name
        run: grep -qF '$practical-coding' practical-coding/agents/openai.yaml
      - name: Ensure legacy local graph runtime is not reintroduced
        run: |
          test ! -e practical-coding/runtime/codebase_memory.py
          test ! -e practical-coding/runtime/_codebase_memory_impl.py
          ! grep -R "runtime/codebase_memory.py" practical-coding/SKILL.md practical-coding/AGENTS.md practical-coding/README.md practical-coding/references
